name: Host MATINO Console

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r console/requirements.txt

      - name: Get cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start site and tunnel
        working-directory: console
        env:
          SITE_PASSWORD: MATINO
          SITE_SECRET: matino-console-secret-2026-fixed
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          FIREBASE_API_KEY: AIzaSyDDk-5RZaPuOtCd86aFhgXpMUNGaTtx5EQ
        run: |
          export PORT=7860
          nohup python app.py > site.log 2>&1 &
          sleep 4
          ../cloudflared tunnel --url http://127.0.0.1:7860 > tunnel.log 2>&1 &
          sleep 15
          echo "===== PUBLIC URL ====="
          grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 | tee public_url.txt
          echo "======================"
          cat site.log

      - name: Publish public URL
        run: |
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' console/tunnel.log | head -1)
          echo "$URL" > SITE_URL.txt
          git config user.name "matino-bot"
          git config user.email "bot@users.noreply.github.com"
          git add SITE_URL.txt
          git commit -m "Publish site URL [skip ci]" || true
          git push || true
          echo "PUBLIC SITE URL: $URL"
          sleep 18000
