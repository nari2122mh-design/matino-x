<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MATINO X · Secure Console</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
      background:#050505; color:#f5f5f5;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .card { width:min(420px,92vw); background:#0d0d0d; border:1px solid #ffffff1f;
      border-radius:20px; padding:32px; box-shadow:0 20px 60px #0009; }
    .logo { width:64px; height:64px; border-radius:16px; background:#000;
      border:1px solid #ffffff1f; display:grid; place-items:center; margin:0 auto 18px;
      font-size:26px; }
    h1 { text-align:center; font-size:24px; letter-spacing:.5px; margin:0 0 6px; }
    p { text-align:center; color:#9a9a9a; font-size:13px; margin:0 0 26px; }
    label { display:block; font-size:11px; letter-spacing:1px; color:#888;
      margin:0 0 8px; font-weight:700; }
    input[type=password] { width:100%; padding:14px 16px; border-radius:12px;
      border:1px solid #ffffff24; background:#161616; color:#fff; font-size:16px;
      outline:none; }
    input[type=password]:focus { border-color:#fff8; }
    button { width:100%; margin-top:18px; padding:14px; border-radius:12px;
      border:1px solid #ffffff5c; background:#1a1a1a; color:#fff;
      font-size:15px; font-weight:700; cursor:pointer; }
    button:hover { background:#242424; }
    .flash { background:#2a1a00; border:1px solid #ffaa0033; color:#ffc066;
      padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:16px; }
    .foot { text-align:center; color:#666; font-size:11px; margin-top:22px; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <div class="logo">🔒</div>
    <h1>MATINO X</h1>
    <p>Secure Console · authorized access only</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    <label>PASSWORD</label>
    <input type="password" name="password" autofocus autocomplete="current-password" required>
    {% if totp_required %}
    <label style="margin-top:14px">2FA CODE</label>
    <input type="text" name="totp" inputmode="numeric" pattern="[0-9]{6}"
           maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
    {% endif %}
    <button type="submit" name="login" value="1" {% if locked %}disabled{% endif %}>
      {% if locked %}LOCKED · TRY LATER{% else %}UNLOCK{% endif %}
    </button>
    <div class="foot">All actions are logged. Do not share this page.</div>
  </form>
</body>
</html>
