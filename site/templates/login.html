<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATINO X · File Drop</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .card { width:min(92vw,360px); background:#0b0b0b; border:1px solid rgba(255,255,255,.18);
          border-radius:18px; padding:28px; }
  h1 { margin:0 0 6px; font-size:22px; letter-spacing:.5px; }
  p  { margin:0 0 22px; color:#888; font-size:13px; }
  input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px;
          border:1px solid rgba(255,255,255,.2); background:#111; color:#fff; outline:none; }
  button { width:100%; margin-top:14px; padding:12px; border-radius:10px; border:1px solid #fff;
           background:transparent; color:#fff; font-weight:700; cursor:pointer; }
  button:hover { background:#fff; color:#000; }
  .warn { color:#f66; font-size:12px; margin-top:12px; }
</style>
</head>
<body>
  <form class="card" method="post">
    <h1>MATINO X</h1>
    <p>Enter the site password to continue.</p>
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit" name="login" value="1">Unlock</button>
    {% if not configured %}<div class="warn">SITE_PASSWORD is not set in .env</div>{% endif %}
  </form>
</body>
</html>
